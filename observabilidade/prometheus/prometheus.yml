global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # As 4 APIs rodam no host (dotnet run), fora do Docker. O label "servico" identifica cada uma nos painéis e alertas.
  - job_name: concessionaria
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5101"]
        labels: { servico: bff }
      - targets: ["host.docker.internal:5128"]
        labels: { servico: carros }
      - targets: ["host.docker.internal:5010"]
        labels: { servico: motos }
      - targets: ["host.docker.internal:5051"]
        labels: { servico: relatorios }

  # A própria stack, para saber se a coleta está funcionando.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
