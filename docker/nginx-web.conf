server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: qualquer rota do React Router (ex.: /carros) devolve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache; o index.html não, para sempre pegar a versão nova.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
